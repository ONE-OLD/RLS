<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RLS Login</title>
<link rel="icon" href="Untitled.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- firebase.js : Firebase v9 compat initialization -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
:root{--bg:#0f172a;--card:#0b1220;--text:#e5e7eb;--muted:#94a3b8;--btn:#2563eb;--btnHover:#1e40af;--border:#1f2937}
.light{--bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#334155;--btn:#2563eb;--btnHover:#1e40af;--border:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,.20)}
.card header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.brand{font-weight:700}
.theme-toggle{cursor:pointer;font-size:14px;color:var(--muted)}
.card .body{padding:20px}
.role-switch{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);cursor:pointer}
.tab.active{background:var(--btn);border-color:var(--btn);color:#fff}
.field{margin-top:10px}
.label{font-size:12px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:12px 12px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text)}
input::placeholder{color:var(--muted)}
.actions{margin-top:16px;display:flex;gap:10px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;background:var(--btn);color:#fff;cursor:pointer}
.btn:hover{background:var(--btnHover)}
.note{margin-top:10px;font-size:12px;color:var(--muted)}
.error{margin-top:10px;color:#ef4444;font-size:13px}
/* Loader */
.loader{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:9999}
.loader .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 28px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid transparent;border-top-color:var(--btn);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loader" class="loader"><div class="box"><div class="spinner"></div><div>Loading RLS...</div></div></div>
<div class="wrap">
  <div class="card">
    <header>
      <div class="brand">Rwamagana Leaders’ School – RLS</div>
      <div class="theme-toggle" onclick="toggleTheme()">Theme</div>
    </header>
    <div class="body">
      <h2 style="margin:0 0 10px">Login</h2>
      <div class="role-switch">
        <button id="tabAdmin" class="tab" onclick="setRole('admin')">Admin</button>
        <button id="tabStudent" class="tab active" onclick="setRole('student')">Student</button>
      </div>
      <div class="field">
        <div class="label">Email</div>
        <input id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <div class="label">Password</div>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="actions">
        <button class="btn" onclick="login()">Login</button>
      </div>
      <div id="error" class="error" style="display:none"></div>
      <div class="note">Select the correct role. Access is strictly role-based.</div>
    </div>
  </div>
</div>

<script src="firebase.js"></script>
<script>
// Minimal role state with UI reflect
let role = localStorage.getItem("rls_role") || "student";
const tabAdmin = document.getElementById("tabAdmin");
const tabStudent = document.getElementById("tabStudent");
function reflectRole(){
  if(role === "admin"){tabAdmin.classList.add("active");tabStudent.classList.remove("active");}
  else {tabStudent.classList.add("active");tabAdmin.classList.remove("active");}
}
reflectRole();

// Set role selection and persist
function setRole(r){ role = r; localStorage.setItem("rls_role", r); reflectRole(); }

// Theme toggle with persistence
document.body.classList.toggle("light", localStorage.getItem("rls_theme") === "light");
function toggleTheme(){ const next = document.body.classList.toggle("light"); localStorage.setItem("rls_theme", next ? "light" : "dark"); }

// After sign-in, verify role in Realtime Database for secure redirect
async function login(){
  hideError();
  showLoading();
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  const email = emailEl.value.trim();
  const password = passEl.value;
  if(!email || !password){ return showError("Enter email and password."); }

  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    if(role === "admin"){
      const snap = await db.ref("admins/"+uid).once("value");
      if(snap.exists() && snap.val().role === "admin"){ window.location.href = "admin.html"; return; }
      await auth.signOut();
      showError("This account is not registered as Admin.");
    } else {
      const snap = await db.ref("students/"+uid).once("value");
      if(snap.exists()){ window.location.href = "student.html"; return; }
      await auth.signOut();
      showError("No student profile found for this account.");
    }
  }catch(e){ hideLoading(); showError(e.message); }
}

function showError(msg){ const el = document.getElementById("error"); el.textContent = msg; el.style.display = "block"; }
function hideError(){ const el = document.getElementById("error"); el.style.display = "none"; }
function showLoading(){ const el=document.getElementById("loader"); if(el) el.style.display="flex"; }
function hideLoading(){ const el=document.getElementById("loader"); if(el) el.style.display="none"; }
hideLoading();
</script>

</body>
</html>
